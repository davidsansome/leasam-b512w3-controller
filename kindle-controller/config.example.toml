# Copy to config.toml next to the KUAL extension (…/extensions/aircon-controller/config.toml)
# and fill in the [home_assistant] section. Everything else is optional.

[home_assistant]
# Use the IP address: the static binary can't resolve .local mDNS names.
url = "http://192.168.1.10:8123"
# Long-lived access token: HA → your profile → Security → Long-lived access tokens.
token = "PASTE-TOKEN-HERE"
# How often battery level, uptime and Wi-Fi signal are sent to HA.
diagnostics_interval_secs = 300

[device]
# How the controller appears in HA (Settings → Devices → Mobile App).
name = "Aircon Wall Controller"
manufacturer = "Amazon"
model = "Kindle Paperwhite (10th gen)"

[display]
# font = "/mnt/us/fonts/SomeFont-Regular.ttf"
full_refresh_every = 20     # partial refreshes of an area before it gets a cleaning flash
waveform_fast = "DU"       # button press feedback
waveform_partial = "GL16"  # normal updates (try "REAGL" too)
waveform_full = "GC16"     # periodic flash to clear ghosting
# Clockwise rotation of the UI: 90 or 270 for landscape (pick whichever way up the
# Kindle is mounted), 0 or 180 for portrait.
rotation = 90

[touch]
# device = "/dev/input/event1"
swap_xy = false
invert_x = false
invert_y = false

[framework]
# "coexist": leave the Kindle UI running but paused underneath us.
# "stop":    stop the Kindle UI service (lab126_gui) while we run. Frees its memory and
#            CPU, but "Exit controller" takes longer while the Kindle UI starts back up.
mode = "stop"
# Paused with SIGSTOP while we run (in both modes), resumed in reverse order on exit.
# Xorg has to be paused, or it repaints Kindle UI windows (e.g. the battery indicator) over
# us. kindle_browser is started by appmgrd, not the UI service, so it outlives "stop".
pause_processes = ["awesome", "cvm", "blanket", "Xorg", "kindle_browser"]
# Ignore the power button while the controller runs, so the Kindle never goes to sleep
# (sleep turns the touchscreen off).
block_power_button = true

# Run `aircon-wall-controller --list-entities` on the Kindle to see the entity ids.
[dashboard]
weather = "weather.forecast_home"
# Rooms aren't set here: they come from the aircon's Rooms entity, set up in Home Assistant
# with the "Aircon rooms" blueprint.

[aircon]
# The HA device the entities below are on. They're then found on it even if HA renames them
# (e.g. to switch.aircon_power_2 after re-adding the device); the ids below are just tried
# first. Leave it out to use exactly these ids. A device renamed in HA goes by its new name
# only, so rename any second "Aircon" (a board on the bench, say) to keep it out.
device = "Aircon"
power = "switch.aircon_power"
mode = "select.aircon_mode"
fan = "select.aircon_fan_speed"
compressor_lockout = "sensor.aircon_compressor_lockout"
# On while the building's condenser-water pump isn't proving flow (the firmware then keeps
# the whole unit off); the controls are replaced by an "ERROR / No water flow" panel.
# Missing or unavailable counts as flow OK.
no_flow = "binary_sensor.aircon_no_flow"
# The thermostat's entities. Controls whose entity HA doesn't have are hidden.
thermostat = "switch.aircon_thermostat"                    # on = thermostat, off = continuous
setpoint = "number.aircon_set_point"
thermostat_room = "select.aircon_thermostat_room"          # Average, or one room
operation = "sensor.aircon_operation"                      # Off, Heating, Cooling, Fan or No flow
auto_direction = "sensor.aircon_auto_direction"            # Heat or Cool, while in Auto
thermostat_status = "sensor.aircon_thermostat_status"
thermostat_temperature = "sensor.aircon_thermostat_temperature"
rooms = "sensor.aircon_rooms"
setpoint_step = 0.5

# The mode and fan selects' option names.
[aircon.mode_options]
heat = "Heat"
cool = "Cool"
fan = "Fan only"
auto = "Auto"

[aircon.fan_options]
low = "Low"
medium = "Medium"
high = "High"
