# Starts the aircon wall controller at boot, instead of the Kindle UI.
#
# Install, remove, enable and disable this with autostart.sh, next to this file. Don't
# edit it in place: autostart.sh also patches /etc/upstart/x_prelaunch.conf so that X (and
# the whole Kindle UI after it) doesn't start while this file is installed. Disabling
# renames it, which turns both off.
#
# The controller draws straight to the framebuffer, so it only needs the background
# services: powerd (backlight, screensaver), cmd and wifid (Wi-Fi), deviced (touch).
#
# There's no respawn. supervise.sh restarts the controller after a crash, and a clean exit
# (Exit from the menu) ends the job. The controller then starts X, which brings the Kindle
# UI up.

description "aircon wall controller"

start on mounted_userstore and started powerd and started cmd and started wifid and started deviced

env PATH=/usr/local/bin:/bin:/usr/bin:/usr/sbin:/sbin:/app/bin:/app/tools:/app/tools/bin
env DIR=/mnt/us/extensions/aircon-controller

pre-start script
    # Without a controller to run, boot into the Kindle UI rather than a blank screen.
    if [ ! -f "$DIR/bin/aircon-wall-controller" ] || [ ! -f "$DIR/config.toml" ]; then
        logger -t aircon-controller "controller or config.toml missing in $DIR: starting the Kindle UI"
        start -n x
        stop
        exit 0
    fi
end script

exec /bin/sh /mnt/us/extensions/aircon-controller/bin/supervise.sh
