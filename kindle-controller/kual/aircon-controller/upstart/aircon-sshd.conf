# Keeps jobman's dropbear SSH server running on the Kindle.
#
# Install to /etc/upstart/aircon-sshd.conf (the root fs is read-only, so
# `mntroot rw` first and `mntroot ro` after). Amazon's own sshd.conf points at
# /usr/local/sbin/dropbear, which doesn't exist on retail firmware, so it's
# left alone and this job runs alongside it.
#
# It also opens port 22 in the firewall, which is otherwise only done when SSH
# is turned on in jobman.
#
# The binary lives on the userstore, so the job starts once that's mounted
# and stops before it's unmounted.

description "dropbear SSH server (aircon wall controller)"

start on mounted_userstore
stop on stopping filesystems

env DROPBEAR=/mnt/us/jobman/bin/dropbearmulti
env PIDFILE=/var/run/aircon-sshd.pid
env LOG=/tmp/aircon-sshd.log

# Upstart 0.6 gives up after ~10 respawns in 5 seconds, so the loop below does
# the restarting and never exits on its own. `respawn` is only a backstop in
# case the shell itself dies.
respawn

script
    # Upstart runs scripts with `sh -e`; without this, dropbear exiting
    # non-zero would end the loop.
    set +e
    while true; do
        # The stock firewall drops incoming port 22 on Wi-Fi. Open it the same
        # way jobman does, re-checking each time in case something reset it.
        iptables -C INPUT -i wlan0 -p tcp --dport 22 -j ACCEPT 2>/dev/null ||
            iptables -A INPUT -i wlan0 -p tcp --dport 22 -j ACCEPT
        if [ -x "$DROPBEAR" ]; then
            echo "$(date '+%Y-%m-%d %H:%M:%S') starting dropbear" >> "$LOG"
            # -F stays in the foreground so the loop notices when it exits.
            # Same options as jobman's own launch: create host keys if missing,
            # HOME=/mnt/us, port 22, and the "kindle" master password.
            "$DROPBEAR" dropbear -F -R -H/mnt/us -p22 -Ykindle -P "$PIDFILE" >> "$LOG" 2>&1
            echo "$(date '+%Y-%m-%d %H:%M:%S') dropbear exited with status $?" >> "$LOG"
        else
            echo "$(date '+%Y-%m-%d %H:%M:%S') $DROPBEAR missing" >> "$LOG"
        fi
        # Keep the log from growing without bound on a long crash loop.
        if [ "$(wc -c < "$LOG")" -gt 262144 ]; then
            tail -c 65536 "$LOG" > "$LOG.tmp" && mv "$LOG.tmp" "$LOG"
        fi
        sleep 5
    done
end script

# Stopping the job kills the loop's shell, not dropbear, so stop the listener
# here. Sessions already open are separate processes and stay up.
post-stop script
    if [ -f "$PIDFILE" ]; then
        kill "$(cat "$PIDFILE")" 2>/dev/null
        rm -f "$PIDFILE"
    fi
end script
